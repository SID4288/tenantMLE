services:
  postgres:
    image: postgres:16
    container_name: tenantmle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenantmle
      POSTGRES_USER: tenantmle
      POSTGRES_PASSWORD: tenantmle
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: